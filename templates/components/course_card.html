{% load i18n %}

<div class="col-12 col-md-6 col-lg-4 d-flex">
    <article class="academy-card course-card w-100">
        <div class="card-media">
            <img src="{{ course.image.url }}"
                 alt="{{ course.localized_image_alt|default:course.localized_name }}"
                 loading="lazy">
            <span class="course-price-badge">{{ course.price|floatformat:2 }}</span>
        </div>
        <div class="card-body d-flex flex-column">
            <h3 class="card-title">{{ course.localized_name }}</h3>
            <div class="course-meta">
                <span class="course-duration">
                    <i class="bi bi-clock" aria-hidden="true"></i>
                    {{ course.localized_duration }}
                </span>
                <span class="course-price">
                    <span class="visually-hidden">{% trans 'Price' %}: </span>{{ course.price|floatformat:2 }}
                </span>
            </div>
            {% if course.localized_short_description %}
            <p class="card-text">{{ course.localized_short_description }}</p>
            {% endif %}
            <div class="mt-auto pt-3">
                <a href="{% url 'course_detail' course.slug %}" class="btn btn-card">
                    {% trans 'View Course' %}
                    <i class="bi bi-arrow-{% if is_rtl %}left{% else %}right{% endif %} ms-1" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </article>
</div>
